[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "okupy"
version = "0.1.0"
description = "Tutorial engine that generates TikTok slideshows and Gemini Omni videos via a 3-agent Claude orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pillow>=10.4.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
agents = ["claude-agent-sdk>=0.1.0"]
video = ["google-genai>=1.0.0"]
sandbox = ["daytona>=0.21.0"]
composio = ["composio>=0.8.0"]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
okupy = "okupy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okupy = ["static/*", "photon_sidecar/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
