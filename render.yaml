# Render Blueprint for Okupy.
# Web service handles HTTP + the generate UI.
# Worker keeps the Photon iMessage sidecar alive (persistent gRPC, not a webhook).
services:
  - type: web
    name: okupy-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn okupy.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: OKUPY_AGENT_MODE
        value: agent
      - key: OKUPY_MODEL
        value: claude-sonnet-4-5
      - key: GEMINI_OMNI_MODEL
        value: gemini-omni-flash-preview
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: OKUPY_FALLBACK_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_API_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_USER_ID
        sync: false
      - key: PHOTON_PROJECT_ID
        sync: false
      - key: PHOTON_PROJECT_SECRET
        sync: false
      - key: PHOTON_SIDECAR_TOKEN
        sync: false
      - key: PHOTON_HOME_CHANNEL
        sync: false
      - key: OKUPY_PUBLIC_BASE_URL
        sync: false

  - type: worker
    name: okupy-imessage
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m okupy.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: OKUPY_AGENT_MODE
        value: agent
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: OKUPY_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: PHOTON_PROJECT_ID
        sync: false
      - key: PHOTON_PROJECT_SECRET
        sync: false
      - key: PHOTON_SIDECAR_TOKEN
        sync: false
      - key: PHOTON_HOME_CHANNEL
        sync: false
      - key: OKUPY_API_URL
        fromService:
          name: okupy-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
