services:
  - type: web
    name: okupy-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: okupy-memory
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AIML_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SPECTRUM_PROJECT_ID
        sync: false
      - key: SPECTRUM_PROJECT_SECRET
        sync: false
      - key: PHOTON_PROJECT_ID
        sync: false
      - key: PHOTON_PROJECT_SECRET
        sync: false
